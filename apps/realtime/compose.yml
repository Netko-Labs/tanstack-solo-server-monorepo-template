services:
  db-realtime:
    image: postgres:17
    profiles: [realtime]
    ports:
      - "${REALTIME_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realtime
    volumes:
      - realtime_postgres_data:/var/lib/postgresql/data

volumes:
  realtime_postgres_data:
