name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR focusing on:
            - Code quality and adherence to project conventions (Biome, single quotes, 2-space indent, 100-char width)
            - Security concerns (OWASP top 10, no secrets in code)
            - Architecture alignment: Domain (Drizzle schemas) -> Repository (DB access) -> Service (business logic) -> tRPC (API) -> Frontend (React)
            - Type safety (no `any`, no ts-ignore/ts-expect-error)
            - Dependency changes (flag unnecessary new dependencies)
            - drizzle-zod patterns: schemas should use createInsertSchema/createUpdateSchema/createSelectSchema

            Keep feedback actionable and concise. Use inline comments for specific issues.
            If the PR looks good overall, approve it with `gh pr review --approve`.
            If there are significant issues, request changes with `gh pr review --request-changes`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read,Glob,Grep"
