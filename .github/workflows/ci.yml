name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: temp-repo
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      CACHE_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/temp-repo
      # a gated suite that cannot reach its service fails here instead of skipping
      REQUIRE_GATED_SUITES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run repo check:nitro-patch --app studio
      - run: cp apps/studio/sample.env apps/studio/.env
      - run: bun run repo db:generate --app studio
      - name: no schema change without its committed migration
        run: |
          drift=$(git status --porcelain -- packages/studio/repository/src/db/drizzle)
          test -z "$drift" || { echo "$drift"; echo 'schema changed without a committed migration'; exit 1; }
      - run: bun run repo db:migrate --app studio
      - run: bun run check-types
      - run: bun run fmt-lint
      - run: bun run test
      - run: bun run repo build --app studio
      - run: bun run repo test:smoke --app studio

  generator:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # one name on each side of "logger", so generated imports sort both ways
      - run: bunx turbo gen app --args smoke
      - run: bunx turbo gen app --args admin
      - run: bunx turbo gen lib --args client acme "Acme API"
      - run: bun install
      # build first: it regenerates the route tree the typecheck reads; the app's own script
      # proves `bun run repo` resolves inside apps/*
      - run: bun run build
        working-directory: apps/smoke
      - run: bun run build
        working-directory: apps/admin
      - run: bun run check-types
      - run: bun run fmt-lint
      - run: bun run test
      - name: every asset the root route links exists in public/
        run: |
          for app in smoke admin; do
            for href in $(grep -o "href: '/[^']*'" "apps/$app/src/routes/__root.tsx" | cut -d"'" -f2); do
              test -f "apps/$app/public$href" || { echo "apps/$app links $href, missing from public/"; exit 1; }
            done
          done
      - name: generated apps load the observability plugin first
        run: |
          for app in smoke admin; do
            grep -q "plugins: \['./src/server/plugins/observability.ts'," "apps/$app/vite.config.ts" \
              || { echo "apps/$app/vite.config.ts does not list observability.ts first"; exit 1; }
          done

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
