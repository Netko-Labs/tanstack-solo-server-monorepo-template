name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened, edited]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run fmt-lint

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  review:
    needs: [quality, commitlint]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ secrets.OPENCODE_MODEL }}
          use_github_token: true
          prompt: |
            Review the pull request diff. Leave inline review comments for specific
            issues and post a concise summary. Focus on:
            - Adherence to the conventions in CLAUDE.md and docs/conventions.md
              (module layout, lib/ + shared/ model, no inline types, UPPER_SNAKE
              constants, ≤300-line files, ≤3 hooks per component file)
            - Architecture flow: domain → repository → service → trpc → ui
            - drizzle-zod patterns (createInsertSchema/createUpdateSchema/createSelectSchema)
            - Biome style (single quotes, 2-space indent, 100-char width)
            - Type safety (no `any`, no ts-ignore/ts-expect-error) and security concerns
            - Unnecessary new dependencies

            Report every finding with a confidence level and severity; a maintainer
            will decide what to act on. Request changes for significant issues, or
            approve with `gh pr review --approve` if it looks good. Note: the default
            GITHUB_TOKEN cannot approve PRs, so prefer a summary + request-changes.
