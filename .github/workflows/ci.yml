name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened, edited]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run fmt-lint

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  review:
    needs: [quality, commitlint]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ secrets.OPENCODE_MODEL }}
          use_github_token: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR focusing on:
            - AGENTS.md definitions layout (module definitions/, no inline types, UPPER_SNAKE constants)
            - AGENTS.md frontend conventions (definitions/ colocation, component hierarchy, ≤300 lines, ≤3 hooks per component file)
            - Code quality and adherence to project conventions (Biome, single quotes, 2-space indent, 100-char width)
            - Security concerns (OWASP top 10, no secrets in code)
            - Architecture alignment: Domain (Drizzle schemas) -> Repository (DB access) -> Service (business logic) -> tRPC (API) -> Frontend (React)
            - Type safety (no `any`, no ts-ignore/ts-expect-error)
            - Dependency changes (flag unnecessary new dependencies)
            - drizzle-zod patterns: schemas should use createInsertSchema/createUpdateSchema/createSelectSchema

            Keep feedback actionable and concise. Leave inline review comments for specific issues.
            If the PR looks good overall, approve it with `gh pr review --approve`.
            If there are significant issues, request changes with `gh pr review --request-changes`.
