name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model anthropic/claude-sonnet-4.6"
        env:
          # Route Claude Code through Vercel AI Gateway (native Anthropic Messages API).
          # ANTHROPIC_API_KEY must be empty so the CLI uses ANTHROPIC_AUTH_TOKEN.
          ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ""
